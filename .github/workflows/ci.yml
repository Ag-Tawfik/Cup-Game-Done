name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static export
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Verify export output
        run: test -f out/index.html

      - name: Install Playwright browser
        if: matrix.node == 22
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        if: matrix.node == 22
        run: npx playwright test

      - name: Upload Playwright report
        if: matrix.node == 22 && failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload export
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7
